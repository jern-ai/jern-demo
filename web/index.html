<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Temperature converter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    label { display: block; margin-top: 1rem; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    #result { margin-top: 1.5rem; font-size: 1.5rem; font-weight: 700; }
    .hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Temperature converter</h1>
  <p class="hint">Enter a temperature in Fahrenheit and read it in Celsius.</p>
  <form id="converter">
    <label for="fahrenheit">Fahrenheit</label>
    <input id="fahrenheit" name="fahrenheit" type="number" step="any" value="212">
    <button id="convert" type="submit">Convert</button>
  </form>
  <p id="result" aria-live="polite">Waiting for a value.</p>
  <script src="converter.js"></script>
</body>
</html>
