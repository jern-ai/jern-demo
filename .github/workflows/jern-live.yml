name: governed issue delivery

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue to resolve
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  repair:
    name: issue to pull request
    environment: governed-live
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jern-ai/jern/action@f3df9187a91c9d1f3847bc7748d76cdb86efb602
        id: jern
        with:
          version: "0.14.5"
          live-issue: ${{ inputs.issue_number }}
          live-delivery: "pull-request"
          live-token-budget: "20000"
          baseline-path: .github/jern-live-baseline.json
          tests: "false"
          golden: "false"
          comment: "false"
          cloud-upload: "true"

      - name: Verify governed result
        env:
          LIVE_OUTCOME: ${{ steps.jern.outputs.live-outcome }}
          CLOUD_RUNS: ${{ steps.jern.outputs.cloud-runs }}
          PULL_REQUEST: ${{ steps.jern.outputs.live-pull-request }}
        run: |
          set -euo pipefail
          test "$LIVE_OUTCOME" = "success"
          test -n "$CLOUD_RUNS"
          test -n "$PULL_REQUEST"
          python3 - <<'PY'
          from src.temperature import kelvin_to_celsius

          assert kelvin_to_celsius(273.15) == 0
          assert kelvin_to_celsius(373.15) == 100
          PY
          mapfile -t changed_files < <(git diff --name-only "$GITHUB_SHA" HEAD)
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "src/temperature.py"
          echo "Governed issue delivered as $PULL_REQUEST with Jern Cloud run: $CLOUD_RUNS"
