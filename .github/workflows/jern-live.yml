name: governed task delivery

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the governed agent (set task or issue_number)
        required: false
        type: string
      issue_number:
        description: GitHub issue to resolve (set issue_number or task)
        required: false
        type: string
      task_id:
        description: Jern Cloud task identity
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  repair:
    name: task to pull request
    environment: governed-live
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jern-ai/jern/action@44a9e660ec17dcdf409dc8be9f0f32e79989b546
        id: jern
        with:
          version: "0.14.5"
          live-task: ${{ inputs.task }}
          live-issue: ${{ inputs.issue_number }}
          live-task-id: ${{ inputs.task_id }}
          live-delivery: "pull-request"
          live-token-budget: "20000"
          baseline-path: .github/jern-live-baseline.json
          tests: "false"
          golden: "false"
          comment: "false"
          cloud-upload: "true"

      - name: Verify governed result
        env:
          LIVE_OUTCOME: ${{ steps.jern.outputs.live-outcome }}
          CLOUD_RUNS: ${{ steps.jern.outputs.cloud-runs }}
          PULL_REQUEST: ${{ steps.jern.outputs.live-pull-request }}
        run: |
          set -euo pipefail
          test "$LIVE_OUTCOME" = "success"
          test -n "$CLOUD_RUNS"
          test -n "$PULL_REQUEST"
          mapfile -t changed_files < <(git diff --name-only "$GITHUB_SHA" HEAD)
          test "${#changed_files[@]}" -gt 0
          echo "Governed task delivered as $PULL_REQUEST with Jern Cloud run: $CLOUD_RUNS"
